amcl:
  ros__parameters:

    use_sim_time: false

    # Frames
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

    # Sensor
    scan_topic: /scan

    # Modelo del robot
    robot_model_type: nav2_amcl::DifferentialMotionModel

    # Frecuencia
    update_min_d: 0.05
    update_min_a: 0.05

    # Láser
    laser_min_range: 0.02
    laser_max_range: 20.0
    laser_model_type: likelihood_field

    # Partículas
    min_particles: 500
    max_particles: 2000

    # Inicialización
    set_initial_pose: false

    # Publicación
    tf_broadcast: true

    # Covarianzas / movimiento
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Beam model
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5

    sigma_hit: 0.2
    lambda_short: 0.1

    # Recuperación
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0